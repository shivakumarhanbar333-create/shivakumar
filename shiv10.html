<!DOCTYPE html>
<html>
    <head>
        <title>responsive webpage</title>
        <meta namwe="viewport"content="width=device-width,initial-scale=1.0">
        <style>
            body{
                margin:0;
                font-family:arial,sans-serif;
                fonjt-size:1 rem;
            }
            header{
                background-color:navy;
                color:white;
                text-align:center;
                padding:2vh
            }
            .container{
                width: 80%;
                margin:2em auto;
                display: flex;
                gap:2%;
            }
            .box{
                background-color: lightblue;
                width: 50%;
                padding:2%;
                text-align: center
                font-size:2vw;
            }
            /*mobile*/
            @media(max-width:480px){
                .container{
                    flex-direction: column;

            }
            .box{
                width:96%;
                font-size: 1rem;
                margin-buttom:10px;

            }
        }
        </style>
    </head>
    <body>
           <header>
        <h1>my webpage</h1>
           </header>
    <div class="container">
        <div class="box">box 1</div>
        <div class="box">box 2/div>
    </div>
   
    
    </body>
</html>
