<!DOCTYPE html>
<html>
    <head>
        <title>flexbox navigation bar</title>
        <style>
            nav{
                display: flex;
                justify-content:center;
                gap: 30px;
                background-color: black;
                padding: 15px;
            }
            nav a {
                color: white;
                text-decoration: none;
                font-size: 18px;
            }
            nav a:hover{
                color:yellow;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="#">home</a>
            <a href="#">about</a>
             <a href="#">services</a>
              <a href="#">contact</a>
        
        </nav>
    </body>
</html>
